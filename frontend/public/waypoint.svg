<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#863bff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.9)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Career Path lines forming a "W" — 5 milestone nodes -->
  <polyline
    points="5,10 10,22 16,13 22,22 27,10"
    fill="none"
    stroke="rgba(255,255,255,0.45)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Milestone nodes -->
  <circle cx="5"  cy="10" r="2.2" fill="white" opacity="0.75"/>
  <circle cx="10" cy="22" r="2.0" fill="white" opacity="0.65"/>
  <!-- Centre node: the KEY waypoint — bigger + bright -->
  <circle cx="16" cy="13" r="3.0" fill="white"/>
  <circle cx="22" cy="22" r="2.0" fill="white" opacity="0.65"/>
  <circle cx="27" cy="10" r="2.2" fill="white" opacity="0.75"/>

  <!-- Sparkle on centre node = AI signal -->
  <circle cx="16" cy="13" r="1.2" fill="#6366f1"/>
</svg>
